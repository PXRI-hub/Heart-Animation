<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Red Particle Heart</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #000;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;
let cx;
let cy;

const particles = [];
const sparks = [];

const PARTICLE_COUNT = 2200;
const SPARK_COUNT = 90;

let rotation = 0;

// CANVAS SIZE

function resize() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cx = width / 2;
    cy = height / 2 - 40;
}

resize();

window.addEventListener("resize", resize);

// HEART PARTICLES

function createHeart() {

    particles.length = 0;

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const t = Math.random() * Math.PI * 2;

        // Heart equation
        let x = 16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);


        // Fill heart
        const fill = Math.sqrt(Math.random());

        x *= fill;
        y *= fill;


        // Give heart depth
        const z =
            (Math.random() - 0.5) *
            13 *
            (1 - fill * 0.25);


        // Mostly deep red with some bright red
        const brightness =
            Math.random();

        let color;

        if (brightness > 0.90) {
            color = "#ffffff";
        }

        else if (brightness > 0.70) {
            color = "#ff6b6b";
        }

        else if (brightness > 0.35) {
            color = "#ff1f3d";
        }

        else {
            color = "#b90020";
        }


        particles.push({

            x: x,
            y: -y,
            z: z,

            size:
                Math.random() * 1.3 + 0.35,

            color: color,

            phase:
                Math.random() * Math.PI * 2,

            twinkleSpeed:
                Math.random() * 0.002 + 0.001
        });
    }
}

createHeart();

// FLOATING SPARKS

function createSparks() {

    for (let i = 0; i < SPARK_COUNT; i++) {

        sparks.push({

            angle:
                Math.random() *
                Math.PI * 2,

            distance:
                Math.random() * 260 + 80,

            y:
                Math.random() * 500 - 250,

            speed:
                Math.random() * 0.15 + 0.04,

            size:
                Math.random() * 1.3 + 0.3,

            opacity:
                Math.random() * 0.5 + 0.1
        });
    }
}

createSparks();

// DRAW BACKGROUND GLOW

function drawGlow() {

    const glow = ctx.createRadialGradient(
        cx,
        cy,
        20,
        cx,
        cy,
        350
    );

    glow.addColorStop(
        0,
        "rgba(255,0,35,0.10)"
    );

    glow.addColorStop(
        0.4,
        "rgba(150,0,20,0.035)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        cx - 400,
        cy - 400,
        800,
        800
    );
}

// DRAW HEART

function drawHeart(time) {

    const scale =
        Math.min(width, height) / 48;


    // Very slow smooth rotation
    rotation += 0.0022;


    // Subtle heartbeat
    const heartbeat =
        1 +
        Math.sin(time * 0.002) *
        0.018;


    for (const p of particles) {

        // Y-axis 3D rotation
        const cos = Math.cos(rotation);
        const sin = Math.sin(rotation);

        const rotatedX =
            p.x * cos -
            p.z * sin;

        const rotatedZ =
            p.x * sin +
            p.z * cos;


        // Perspective
        const perspective =
            420 /
            (420 + rotatedZ * 8);


        const x =
            cx +
            rotatedX *
            scale *
            perspective *
            heartbeat;

        const y =
            cy +
            p.y *
            scale *
            perspective *
            heartbeat;


        // Smooth shimmer
        const shimmer =
            0.65 +
            Math.sin(
                time *
                p.twinkleSpeed +
                p.phase
            ) * 0.35;


        const size =
            Math.max(
                0.35,
                p.size *
                perspective *
                shimmer
            );


        ctx.globalAlpha =
            0.35 +
            shimmer * 0.65;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// OUTER FLOATING SPARKS

function drawSparks() {

    for (const p of sparks) {

        p.y -= p.speed;

        p.angle += 0.0008;


        if (p.y < -280) {

            p.y = 280;

            p.distance =
                Math.random() * 260 + 80;
        }


        const x =
            cx +
            Math.cos(p.angle) *
            p.distance;

        const y =
            cy +
            p.y;


        ctx.globalAlpha =
            p.opacity;

        ctx.fillStyle =
            "#ff2945";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}
// ENERGY PLATFORM

function drawPlatform(time) {

    const y =
        cy + 245;


    // Soft red glow
    const glow =
        ctx.createRadialGradient(
            cx,
            y,
            0,
            cx,
            y,
            150
        );


    glow.addColorStop(
        0,
        "rgba(255,20,45,.40)"
    );

    glow.addColorStop(
        .3,
        "rgba(255,0,30,.16)"
    );

    glow.addColorStop(
        1,
        "rgba(255,0,0,0)"
    );


    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.ellipse(
        cx,
        y,
        160,
        35,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Rotating energy rings

    ctx.save();

    ctx.translate(cx, y);

    ctx.rotate(time * 0.0005);


    ctx.strokeStyle =
        "rgba(255,40,60,.65)";

    ctx.lineWidth = 1.4;


    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        120,
        19,
        0,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.rotate(-time * 0.0012);


    ctx.strokeStyle =
        "rgba(255,110,120,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        0,
        145,
        24,
        0,
        0,
        Math.PI * 1.65
    );

    ctx.stroke();


    ctx.restore();
}

// ANIMATION

function animate(time) {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    drawGlow();

    drawSparks();

    drawPlatform(time);

    drawHeart(time);


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
